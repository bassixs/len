<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Каталог изделий из натурального льна — нжен ЛЁН. Одежда, текстиль, аксессуары."
        />
        <title>Каталог — нжен ЛЁН</title>
        <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
        <link rel="stylesheet" href="styles.css?v=2.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    </head>

    <body>
        {{> header }}

        <section class="catalog-hero-minimal">
            <div class="container">
                <h1 class="ch-title reveal">Каталог</h1>
                <p class="ch-count reveal reveal-delay-1">Все изделия (...)</p>
                <div class="ch-toolbar reveal reveal-delay-2">
                    <div class="ch-toolbar-cats">
                        <a href="catalog.html" class="ch-subcat active">Все категории</a>
                        <a href="category.html?cat=home-textile" class="ch-subcat"
                            >Домашний текстиль</a
                        >
                        <a href="category.html?cat=women" class="ch-subcat">Женская одежда</a>
                        <a href="category.html?cat=men" class="ch-subcat">Мужская одежда</a>
                        <a href="category.html?cat=accessories" class="ch-subcat">Аксессуары</a>
                        <a href="category.html?cat=gifts" class="ch-subcat">Подарки</a>
                    </div>
                    <select id="catalogSortMain" class="catalog-sort-select">
                        <option value="">По умолчанию</option>
                        <option value="price_asc">Цена: по возрастанию</option>
                        <option value="price_desc">Цена: по убыванию</option>
                        <option value="name_asc">Название: А — Я</option>
                        <option value="name_desc">Название: Я — А</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="catalog-grid">
                    <div class="catalog-loading">Загрузка каталога...</div>
                </div>
                <div id="catalogPagination" class="category-pagination"></div>
            </div>
        </section>

        {{> footer }} {{> modals }}
        <script type="module" src="/js/main.js"></script>
    </body>
</html>

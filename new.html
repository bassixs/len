<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Новинки и новые поступления — Нжен ЛЁН. Изделия из натурального льна в каталоге."
        />
        <title>Новинки — Нжен ЛЁН</title>
        <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
        <link rel="stylesheet" href="styles.css?v=2.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    </head>

    <body>
        {{> header }}

        <div class="ch-ref-header">
            <div class="container">
                <div class="ch-ref-breadcrumbs">
                    <a href="index.html">Главная</a> / <span class="active">Новинки</span>
                </div>

                <div class="ch-ref-title-wrap">
                    <h1 class="ch-ref-title">Новинки</h1>
                    <span class="ch-ref-count">(новые поступления)</span>
                </div>

                <div class="ch-ref-toolbar">
                    <div class="ch-ref-subcats">
                        <a href="catalog.html" class="ch-ref-subcat-back"
                            ><i class="fas fa-chevron-left"></i> К каталогу</a
                        >
                        <a href="#" class="ch-ref-subcat active" data-filter="all"
                            >Все новинки <span id="newArrivalsCount">(0)</span></a
                        >
                    </div>
                </div>
            </div>
        </div>
        <section class="section">
            <div class="container">
                <div class="new-products-grid">
                    <div class="catalog-loading">Загрузка новинок...</div>
                </div>
            </div>
        </section>

        {{> footer }} {{> modals }}
        <script type="module" src="/js/main.js"></script>
    </body>
</html>
